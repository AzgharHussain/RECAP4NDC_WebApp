# nginx.conf — Production configuration for serving the RECAP4NDC frontend.
#
# Handles 50000+ concurrent users with:
#   - Static asset caching (1 year for hashed files)
#   - Gzip + Brotli compression
#   - Connection keep-alive optimization
#   - Reverse proxy to the Node.js backend (api cluster)
#   - WebSocket support (if needed)
#   - Rate limiting on API endpoints
#
# Usage:
#   1. Build the frontend:  cd Web && npm run build
#   2. Copy dist/ to /var/www/recap4ndc
#   3. Copy this file to /etc/nginx/sites-available/recap4ndc
#   4. ln -s /etc/nginx/sites-available/recap4ndc /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# Or use with Docker (see Dockerfile.frontend).

# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# --- Upstream backend (Node.js cluster / PM2) ---
upstream recap4ndc_backend {
    # Add multiple backend instances here for horizontal scaling
    # server 127.0.0.1:5002 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:5003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=30s;

    # Keepalive connections to backend (reduces TCP overhead)
    keepalive 100;
    keepalive_timeout 65s;
}

server {
    listen 80;
    server_name _;  # Replace with your domain

    # Redirect HTTP to HTTPS (uncomment if you have SSL)
    # return 301 https://$host$request_uri;

    # --- Static frontend files ---
    root /var/www/recap4ndc/dist;
    index index.html;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        font/woff2
        image/svg+xml;

    # --- Brotli compression (requires ngx_brotli module) ---
    #brotli on;
    #brotli_comp_level 6;
    #brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Static assets with long cache (hashed filenames) ---
    # Vite outputs files with content hashes, so they're safe to cache for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Static files in public/ (favicon, etc.) ---
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --- API reverse proxy ---
    location /api/ {
        # Rate limit: 30 requests/sec per IP (burst allowed)
        limit_req zone=api_limit burst=60 nodelay;

        # Proxy to Node.js backend
        proxy_pass http://recap4ndc_backend;
        proxy_http_version 1.1;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — must be longer than backend query timeout (30s)
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering for large responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- Login endpoint: stricter rate limiting ---
    location /api/forest-login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://recap4ndc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # --- Health check (no rate limit) ---
    location /api/health {
        proxy_pass http://recap4ndc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Geoserver proxy ---
    location /geoserver/ {
        proxy_pass https://gisfy.co.in:8445/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Host gisfy.co.in:8445;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # --- Forest SOAP proxy ---
    location /forest-proxy/ {
        proxy_pass https://egujforest.gujarat.gov.in/;
        proxy_http_version 1.1;
        proxy_set_header Host egujforest.gujarat.gov.in;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # --- SPA fallback: serve index.html for all client-side routes ---
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache index.html — it contains the latest hashed asset references
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # --- Custom error pages ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/recap4ndc/dist;
        internal;
    }
}
